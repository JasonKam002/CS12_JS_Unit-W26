<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link href="style.css" rel="stylesheet" type="text/css" />

    <title>JS5 - Pizza Palace</title>
  </head>

  <body>
    <div class="wrapper">
      <h1 class="heading">Raider Pizza Palace</h1>
      <div class="grid">
        <div class="menu">
          <h3>Menu</h3>
          <p>$10 Small</p>
          <p>$12 Medium</p>
          <p>$14 Large</p>
          <p>$1.50 / Topping</p>
          <img
            class="pizzaImg"
            src="pizza.jpg"
            height="80px"
            alt="pic of pizza"
          />
        </div>
        <div class="right">
          <h3>Order Here:</h3>
          <form class="orderform" name="orderform">
            <div class="field">
              Name: <input type="text" class="name" name="" value="" />
            </div>

            <div class="field">
              # of Pizzas: <input></input>
              <!--number input -->
            </div>
            <div class="field">
              Size:
              <!--three radio buttons-->
              <label><input onclick="changeSize()" type="radio" name="size" value="small">Small</label>
              <label><input onclick="changeSize()" type="radio" name="size" value="medium">Medium</label>
              <label><input onclick="changeSize()" type="radio" name="size" value="large">Large</label>
            </div>
            <hr />

            <h4>Toppings</h4>
            <!-- add a topping here -->
            Cheese<input type="checkbox" name="topping" value="cheese"></input>
            <br />
            <!-- add a topping here -->
            Pepperoni<input type="checkbox" name="topping" value="pepperoni"></input>
            <br />
            <!-- add a topping here -->
            Onions<input type="checkbox" name="topping" value="onions"></input>
            <br />
            <!-- add a topping here -->
            Bacon<input type="checkbox" name="topping" value="bacon"></input>
            <br />
            <!-- add a topping here -->
            Spinach<input type="checkbox" name="topping" value="spinach"></input>
            <br />

            <br />
            <hr />
            <div style="margin: 0 auto">
              <!--add order button here -->
              <button type="button">Order Total</button>
              <button type="reset">Reset</button>

              <!--add reset button here -->
            </div>
          </form>
        </div>
      </div>
      <div class="details">
        <h3 style="margin: 0 auto">Your Order Details</h3>
        <div class="details-field">
          Subtotal
          <input type="text" class="subtotal" name="" value="0" readonly />
        </div>
        <div class="details-field">
          Tax: <input type="text" class="tax" name="" value="0" readonly />
        </div>
        <div class="details-field">
          Total: <input type="text" class="total" name="" value="0" readonly />
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
